# LoadBalancer: AKS creates an Azure public IP and forwards its port 8080 to the pods' port 8080.
apiVersion: v1
kind: Service
metadata:
  name: deadlinedash
  namespace: deadlinedash
spec:
  type: LoadBalancer
  selector:
    app: deadlinedash
  ports:
    - port: 8080          # public port (was 80); targetPort is the container port
      targetPort: 8080
