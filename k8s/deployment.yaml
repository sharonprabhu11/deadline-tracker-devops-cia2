apiVersion: apps/v1
kind: Deployment
metadata:
  name: deadlinedash
  namespace: deadlinedash
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deadlinedash
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never remove an old pod until a new one is Ready
      maxSurge: 1
  template:
    metadata:
      labels:
        app: deadlinedash
    spec:
      containers:
        - name: deadlinedash
          # Placeholder. Ansible (first deploy) and the pipeline (`kubectl set image`) put the real
          # <ACR_LOGIN_SERVER>/deadlinedash:<commit-sha> here. Never "latest".
          image: ACR_LOGIN_SERVER/deadlinedash:IMAGE_TAG
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: deadlinedash-config
            - secretRef:
                name: deadlinedash-db
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70"
          startupProbe:            # gives the JVM + Flyway up to 60 s before liveness starts
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 640Mi
