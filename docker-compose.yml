# Local run: app + Postgres on http://localhost:8080  (dev password only, never used in the cloud)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deadlinedash
      POSTGRES_USER: deadlinedash
      POSTGRES_PASSWORD: deadlinedash
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deadlinedash -d deadlinedash"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-local-compose}
    environment:
      DB_HOST: db
      DB_NAME: deadlinedash
      DB_USER: deadlinedash
      DB_PASSWORD: deadlinedash
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
