name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

# id-token: lets the job ask GitHub for an OIDC token that Azure exchanges for access (no stored keys)
permissions:
  id-token: write
  contents: read

env:
  APP: deadlinedash
  NAMESPACE: deadlinedash

jobs:
  build-test:            # stages 1-3: runs on pushes and pull requests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven package
        run: ./mvnw -B package -DskipTests

      - name: Run tests
        run: ./mvnw -B verify

  deploy:                # stages 4-8: only on pushes to main
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Compute image name
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          IMAGE="${ACR_NAME}.azurecr.io/${APP}:${SHA_SHORT}"
          echo "SHA_SHORT=${SHA_SHORT}" >> "$GITHUB_ENV"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: docker build --build-arg GIT_SHA="${SHA_SHORT}" -t "${IMAGE}" .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to Azure (OIDC)
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push image to ACR
        run: |
          az acr login --name "${ACR_NAME}"
          docker push "${IMAGE}"

      - name: Get AKS credentials
        run: |
          az aks get-credentials --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" \
            --name "${{ vars.AKS_CLUSTER }}" --admin --overwrite-existing

      - name: Deploy (kubectl set image)
        id: deploy
        run: |
          # First run only: the Deployment does not exist yet, so create it with the real image.
          if ! kubectl -n "${NAMESPACE}" get deployment "${APP}" >/dev/null 2>&1; then
            sed "s#ACR_LOGIN_SERVER/deadlinedash:IMAGE_TAG#${IMAGE}#" k8s/deployment.yaml | kubectl apply -f -
          fi
          kubectl -n "${NAMESPACE}" set image "deployment/${APP}" "${APP}=${IMAGE}"

      - name: Verify rollout and live commit SHA
        id: verify
        run: |
          kubectl -n "${NAMESPACE}" rollout status "deployment/${APP}" --timeout=300s
          IP=$(kubectl -n "${NAMESPACE}" get service "${APP}" -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "Service IP: ${IP}"
          for i in $(seq 1 30); do
            LIVE=$(curl -fsS "http://${IP}/api/info" | python3 -c 'import json,sys; print(json.load(sys.stdin)["commitSha"])' || true)
            echo "attempt ${i}: live SHA = '${LIVE}', expected '${SHA_SHORT}'"
            [ "${LIVE}" = "${SHA_SHORT}" ] && exit 0
            sleep 5
          done
          echo "New SHA never appeared on /api/info"
          exit 1

      - name: Roll back on failed verification
        if: failure() && steps.deploy.outcome == 'success' && steps.verify.outcome == 'failure'
        run: |
          kubectl -n "${NAMESPACE}" rollout undo "deployment/${APP}"
          kubectl -n "${NAMESPACE}" rollout status "deployment/${APP}" --timeout=300s
