# Tests use in-memory H2 (no Postgres needed). The same Flyway migration runs on it.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Keep the rollback-demo switch off in tests so they stay green
deadlinedash.demo.fail-readiness=false
